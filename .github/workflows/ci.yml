name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ghcr.io/agundur-kde/plasmoid-ci:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test (ctest — includes metadata validation)
        run: ctest --test-dir build --output-on-failure
        env:
          # No real display in CI — Qt Quick Test needs a QPA platform that
          # doesn't need one, otherwise tst_plasmoid aborts.
          QT_QPA_PLATFORM: offscreen

      - name: shellcheck rename.sh
        run: shellcheck rename.sh

      - name: qmllint
        run: find package/contents -name '*.qml' -print0 | xargs -0 qmllint6
