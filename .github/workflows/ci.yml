name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # KF6 packages aren't in Ubuntu 24.04's default repos yet — the
          # Kubuntu backports PPA (the same one the README points Ubuntu
          # users at) carries them.
          sudo add-apt-repository -y ppa:kubuntu-ppa/backports
          sudo apt-get update
          sudo apt-get install -y \
            cmake extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qml6-module-qttest \
            libkf6config-dev libkf6i18n-dev libkf6kcmutils-dev libkf6coreaddons-dev \
            gettext

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test (ctest — includes metadata validation)
        run: ctest --test-dir build --output-on-failure

      - name: shellcheck rename.sh
        run: |
          sudo apt-get install -y shellcheck
          shellcheck rename.sh

      - name: qmllint
        run: |
          QMLLINT="$(command -v qmllint6 || command -v qmllint)"
          find package/contents -name '*.qml' -print0 | xargs -0 "$QMLLINT"
